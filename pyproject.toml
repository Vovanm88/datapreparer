[project]
name = "imgenmaga"
version = "0.1.0"
description = "CommonCatalog SFT image dataset preparation tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fsspec>=2024.6",
    "httpx>=0.27",
    "huggingface-hub>=0.23",
    "numpy>=1.26",
    "pillow>=10.3",
    "polars>=1.0",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
quality = [
    "opencv-python-headless>=4.9",
]
test = [
    "pytest>=8.2",
]

[project.scripts]
prepare-sft-dataset = "data.prepare_sft_dataset.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
